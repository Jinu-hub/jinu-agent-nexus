<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DAMI</title>
    <link rel="icon" href="/favicon.svg?v=dami6" type="image/svg+xml" />
    <!-- Set the theme class before React renders so the page doesn't
         flash light-mode before flipping to dark. Prefers a saved
         choice, otherwise falls back to the OS setting. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("theme");
          var prefersDark = window.matchMedia(
            "(prefers-color-scheme: dark)",
          ).matches;
          var dark = saved ? saved === "dark" : prefersDark;
          if (dark) document.documentElement.classList.add("dark");
        } catch (_) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
